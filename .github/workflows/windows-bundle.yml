name: Windows bundle

# Builds Rustclear-windows.zip: RustClear.exe (room data is compiled in) plus the launcher, so
# players need no compilers. install.ps1 downloads it from the latest *published* release.
# Run it by hand from the Actions tab. With "draft_release" it attaches the zip to a draft release,
# which stays private until someone publishes it.

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Attach the zip to a draft release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get room data
        uses: actions/checkout@v4
        with:
          repository: Moo-ody/Evensmallerdungeonsdata
          ref: main
          path: ClearData

      - name: Copy room data into the project
        shell: bash
        run: |
          rm -rf src/room_data
          cp -r ClearData/room_data src/room_data

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-bundle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-bundle-

      - name: Build
        run: cargo build --release

      - name: Assemble zip
        id: zip
        shell: bash
        run: |
          version=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp target/release/RustClear.exe launcher/start.ps1 "launcher/Start Rustclear.bat" dist/
          cd dist && 7z a ../Rustclear-windows.zip ./*

      - uses: actions/upload-artifact@v4
        with:
          name: Rustclear-windows
          path: Rustclear-windows.zip

      - name: Attach to draft release
        if: ${{ inputs.draft_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.zip.outputs.version }}
          name: Release v${{ steps.zip.outputs.version }}
          draft: true
          files: Rustclear-windows.zip
